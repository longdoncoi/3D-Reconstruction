[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-d-reconstruction-ai-assistant"
version = "3.0.0"
description = "Modular, policy-first AI Agent Platform for 3D-Reconstruction"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "BLE", "S", "RUF", "C90", "N", "TRY"]

ignore = [
    "BLE001", "S110", "RUF012",
    "S603", "S602", "S607", "S310",
    "W291", "W293", "RUF001",
    "B905", "B007",
    "E501",   # long lines acceptable in this codebase
    "E402",   # module-level imports after code (post-install, post-init patterns)
]

[tool.ruff.lint.mccabe]
# Every function stays at or below 15 branches (ADR 0014, tightened ADR 0016).
# The gate was enabled debt-free: the nine functions that exceeded it across
# both tightenings were decomposed rather than suppressed, so nothing in the
# tree carries a ``# noqa: C901``.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Test fixtures intentionally embed sample secrets and grant tokens; S104 is
# for the bind-address assertions, which assert policy rather than bind a socket.
"tests/**" = ["S105", "S106", "S104"]

[tool.coverage.run]
# Branch coverage is enabled so every conditional in the ReAct loop, the
# approval policy and the transport adapters is counted, not just statements.
branch = true
source = ["ai_assistant"]

[tool.coverage.report]
# ``exclude_also`` *extends* coverage's defaults (pragma, TYPE_CHECKING,
# overload, NotImplementedError) instead of replacing them. The ``__main``
# entry points are claimed once, here, rather than sprinkled as pragmas: they
# re-exec uvicorn (``server.py``) or are launched by the Qt host
# (``server_manager.py``), which no unit test can drive.
exclude_also = [
    "if __name__ == .__main__.:",
]
# Measured, not aspirational (ADR 0015): 100.00% of 7653 statements and 2032
# branches on 2026-10-14 with the full suite (1576 tests) on Python 3.11 with
# ``faiss``/``sentence-transformers`` installed. The number is recorded in
# ARCHITECTURE_10_10_CLOSED.md together with the excluded entry points; a
# stripped-down environment (no optional RAG stack) reports less because the
# optional-dependency branches flip with the environment.
fail_under = 100
# legacy package removed
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
# Full-package type checking: mypy now covers domain, ports, application and
# every adapter/agent/orchestration module. Third-party packages without
# stubs are imported as Any (ignore_missing_imports).
exclude = [
    "src/ai_assistant/legacy/",
]

[tool.importlinter]
root_package = "ai_assistant"
# forbid frameworks (fastapi, langgraph, ...) from the pure core; the external
# packages must be present in the import graph for that check to work.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and ports only touch the standard library and their own layer"
type = "forbidden"
source_modules = ["ai_assistant.domain", "ai_assistant.ports"]
forbidden_modules = [
    "ai_assistant.adapters", "ai_assistant.application", "ai_assistant.agents",
    "ai_assistant.bootstrap", "ai_assistant.config", "ai_assistant.legacy",
    "ai_assistant.llm", "ai_assistant.observability", "ai_assistant.orchestration",
    "ai_assistant.rag", "ai_assistant.tools",
    "fastapi", "langgraph", "langchain", "pydantic", "mcp", "httpx", "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Application depends inward only (domain, ports, plugins)"
type = "forbidden"
source_modules = ["ai_assistant.application"]
forbidden_modules = [
    "ai_assistant.adapters", "ai_assistant.agents", "ai_assistant.bootstrap",
    "ai_assistant.config", "ai_assistant.legacy", "ai_assistant.llm",
    "ai_assistant.observability", "ai_assistant.orchestration", "ai_assistant.rag",
    "ai_assistant.tools",
    "fastapi", "langgraph", "langchain", "pydantic", "mcp", "httpx", "uvicorn",
]

[[tool.importlinter.contracts]]
name = "The legacy modules package stays removed"
type = "forbidden"
source_modules = ["ai_assistant"]
forbidden_modules = ["modules"]

[[tool.importlinter.contracts]]
name = "Agents and orchestration do not import HTTP, bootstrap or legacy directly"
type = "forbidden"
source_modules = ["ai_assistant.agents", "ai_assistant.orchestration"]
forbidden_modules = ["ai_assistant.adapters.http", "ai_assistant.bootstrap", "ai_assistant.legacy"]
# Legacy is reachable only through the sanctioned tools shim
# (tools.builtin.rag_tools); the architecture boundary tests enforce direct
# imports, so check direct imports here too.
allow_indirect_imports = true
