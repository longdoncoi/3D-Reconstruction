[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-d-reconstruction-ai-assistant"
version = "3.0.0"
description = "Modular, policy-first AI Agent Platform for 3D-Reconstruction"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "BLE", "S", "RUF"]

ignore = [
    "BLE001", "S110", "RUF012",
    "S603", "S602", "S607", "S310",
    "W291", "W293", "RUF001",
    "B905", "B007",
    "E501",   # long lines acceptable in this codebase
    "E402",   # module-level imports after code (post-install, post-init patterns)
    "RUF100", # existing noqa directives may reference globally-ignored rules
]

[tool.ruff.lint.per-file-ignores]
# Compatibility shims in modules/ re-export legacy symbols
"modules/*.py" = ["F401", "F403", "F405", "RUF100"]
# TrainModel.py has a noqa directive for PLW1510 which is not in the select list.
"TrainModel.py" = ["RUF100"]
