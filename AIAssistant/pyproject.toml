[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Only check rules that were failing in CI. Ruff default adds E,W,F,I.
# BLE, S, RUF were also flagged. B (bugbear) was not in the original CI run.
select = ["E", "W", "F", "I", "BLE", "S", "RUF"]

# Intentionally ignored patterns in this codebase:
#   BLE001 – catch Exception is intentional in tool-dispatch error boundaries
#             and optional-cleanup paths (torch, ctypes, stream reconfigure)
#   S110   – try/except/pass is intentional for optional resource cleanup
#   RUF012 – class-level mutable defaults — not applicable to these patterns
#   F403   – star imports from .config are intentional (shared-globals pattern)
#   F405   – symbols from star imports used across all modules by design
#   S603   – subprocess with trusted input used for tool execution
#   S602   – subprocess with shell=True used intentionally for agent tools
#   S607   – partial executable path in subprocess is intentional
#   S310   – urllib.request.urlopen to localhost health check is intentional
#   W291   – trailing whitespace in existing code (cosmetic)
#   W293   – blank line contains whitespace (cosmetic)
#   RUF001 – EN dash in Vietnamese comments is intentional
ignore = [
    "BLE001", "S110", "RUF012",
    "F403", "F405",
    "S603", "S602", "S607", "S310",
    "W291", "W293", "RUF001",
    "B905", "B007",
    "E501",   # long lines acceptable in this codebase
    "E402",   # module-level imports after code (post-install, post-init patterns)
    "RUF100", # existing noqa directives may reference globally-ignored rules
]

[tool.ruff.lint.per-file-ignores]
# config.py re-exports all third-party imports for downstream star-import consumers.
# Some symbols are only used in agent_module/rag_module/llm_module, not config.py.
"modules/config.py" = ["F401", "RUF100"]
# TrainModel.py has a noqa directive for PLW1510 which is not in the select list.
"TrainModel.py" = ["RUF100"]

