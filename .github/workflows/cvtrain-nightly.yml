# ──────────────────────────────────────────────────────────────────────────────
# cvtrain nightly — real-dependency smoke test for the training/export pipeline
#
# The offline suite (Build-Python-ci.yml: cvtrain job) drives the pipeline with a
# fake backend, so the only way API drift in the pinned ultralytics version (or
# an ONNX export regression) can surface is to actually train. This job trains
# one detection model for a single epoch on a tiny synthetic dataset, CPU-only,
# and verifies the published manifest. Expensive, so nightly + manual only.
# ──────────────────────────────────────────────────────────────────────────────
name: cvtrain nightly real-deps

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: cvtrain-nightly
  # Never cancel a run mid-download/mid-train: restarting the ML bootstrap costs
  # more than letting it finish.
  cancel-in-progress: false

jobs:
  train-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the real training stack (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r AIComputerVision/requirements.txt pillow

      - name: Generate a toy dataset
        run: python .github/scripts/make_toy_dataset.py --output "$GITHUB_WORKSPACE/Dataset"

      - name: Train + export detection model (1 epoch, CPU)
        run: |
          python AIComputerVision/TrainModel.py --yes --det --epochs 1 --imgsz 64 --batch 2 --workers 0 --device cpu
          python AIComputerVision/TrainModel.py --verify-manifest
          test -f AIComputerVision/Models/yolo11n.onnx

      - name: Upload training logs (kept on failure too)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvtrain-nightly-logs
          path: |
            AIComputerVision/Models/manifest.json
            AIComputerVision/runs/
          if-no-files-found: ignore