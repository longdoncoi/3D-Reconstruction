# ──────────────────────────────────────────────────────────────────────────────
# C++ CI — Build & Test
# Triggers on push/PR to main, skips docs-only changes.
# Uses aggressive caching to minimize build time and token usage.
# ──────────────────────────────────────────────────────────────────────────────
name: C++ CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Docs/**"
      - "Doxygen/**"
      - "AIAssistant/**"
      - ".prompts/**"
      - ".review/**"
      - ".tasks/**"
      - "translations/**"
      - "LICENSE"
      - ".github/workflows/Build-Release-Ver-ci.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Docs/**"
      - "Doxygen/**"
      - "AIAssistant/**"
      - ".prompts/**"
      - ".review/**"
      - ".tasks/**"
      - "translations/**"
      - ".github/workflows/Build-Release-Ver-ci.yml"
  workflow_dispatch:

concurrency:
  group: cpp-ci-${{ github.ref }}
  # VTK/PCL bootstrap can take hours on a cold runner.  Do not throw away a
  # nearly-complete cache build when another commit is pushed.
  cancel-in-progress: false

env:
  VCPKG_INSTALLED_DIR: D:/v
  VCPKG_MAX_CONCURRENCY: 4
  # Enable vcpkg binary caching via GitHub Actions Cache
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # libaec version pinned to match vcpkg baseline 9432c416
  LIBAEC_VERSION: "1.1.6"
  # Pre-provisioned ONNX Runtime.  Configure points FetchContent at this
  # directory instead of downloading the ~323 MB release zip; the version is
  # read from CMakeLists.txt so the two cannot drift apart.
  ONNXRUNTIME_DIR: D:/ort

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The ONNX models of the training pipeline (Git LFS) are needed by
          # TestAIService: without them the AI service cannot be measured at
          # all (aiservice.cpp would report 0 % and the coverage floor would
          # fail). `git lfs pull` is the local equivalent.
          lfs: true

      # ── ONNX Runtime: provision once, reuse from cache afterwards ─────
      - name: Read ONNX Runtime version from CMakeLists.txt
        id: ort
        shell: pwsh
        run: |
          $match = (Select-String -Path CMakeLists.txt -Pattern '^\s*set\(ONNXRUNTIME_VERSION\s+"([^"]+)"\)').Matches
          if (-not $match) { Write-Error "set(ONNXRUNTIME_VERSION ...) not found in CMakeLists.txt"; exit 1 }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          Write-Host "ONNX Runtime version: $($match.Groups[1].Value)"

      - name: Restore ONNX Runtime cache
        id: ort-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.ONNXRUNTIME_DIR }}
          key: onnxruntime-win-x64-gpu-${{ steps.ort.outputs.version }}

      - name: Provision ONNX Runtime (cache miss)
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.ort.outputs.version }}"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-win-x64-gpu-$ver.zip"
          # Keep the URL template above in lock-step with CMakeLists.txt.
          $declared = (Select-String -Path CMakeLists.txt -Pattern '^\s*set\(ONNXRUNTIME_URL\s+"([^"]+)"\)').Matches.Groups[1].Value
          $declared = $declared.Replace('${ONNXRUNTIME_VERSION}', $ver)
          if ($declared -ne $url) { Write-Error "CMakeLists.txt ONNXRUNTIME_URL ($declared) does not match the workflow URL ($url)"; exit 1 }
          $zip = "$env:RUNNER_TEMP/onnxruntime.zip"
          Write-Host "Downloading $url (cache miss)"
          curl.exe --fail --location --retry 3 --output $zip $url
          if ($LASTEXITCODE -ne 0) { Write-Error "curl.exe failed with exit code $LASTEXITCODE"; exit 1 }
          $extract = "$env:RUNNER_TEMP/ort-extract"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          # bsdtar extracts the ~1.2 GB tree far faster than Expand-Archive.
          tar -xf $zip -C $extract
          if ($LASTEXITCODE -ne 0) { Write-Error "tar failed with exit code $LASTEXITCODE"; exit 1 }
          # The release zip wraps everything in one versioned directory; strip
          # it so the layout matches FetchContent's (include/, lib/ at the root).
          $top = @(Get-ChildItem -Path $extract)
          Remove-Item $env:ONNXRUNTIME_DIR -Recurse -Force -ErrorAction SilentlyContinue
          if ($top.Count -eq 1 -and $top[0].PSIsContainer) {
            Move-Item -Path $top[0].FullName -Destination $env:ONNXRUNTIME_DIR
          } else {
            New-Item -ItemType Directory -Path $env:ONNXRUNTIME_DIR -Force | Out-Null
            Move-Item -Path (Join-Path $extract '*') -Destination $env:ONNXRUNTIME_DIR
          }
          Write-Host "Provisioned ONNX Runtime $ver at $env:ONNXRUNTIME_DIR"

      # ── Export GitHub Actions cache env for vcpkg binary caching ──────
      - name: Export GitHub Actions cache env
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL',
              process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN',
              process.env.ACTIONS_RUNTIME_TOKEN || '');

      # ── Create vcpkg triplet overlay (release-only) ─────────────────
      - name: Create release-only triplet overlay
        shell: pwsh
        run: |
          $tripletDir = "custom-triplets"
          New-Item -ItemType Directory -Path $tripletDir -Force | Out-Null
          @"
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_BUILD_TYPE release)
          "@ | Out-File -Encoding utf8 "$tripletDir/x64-windows.cmake"
          Write-Host "Created release-only triplet at $tripletDir/x64-windows.cmake"

      # ── Qt6 (cached by install-qt-action) ─────────────────────────────
      - name: Install Qt 6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.5.*"
          modules: "qtimageformats"
          cache: true

      # ── vcpkg with Binary Caching ─────────────────────────────────────
      - name: Restore vcpkg cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          # The install root is stable. vcpkg's x-gha binary source caches
          # package archives independently, so do not depend on an action
          # implementation-specific VCPKG_ROOT here.
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: vcpkg-${{ runner.os }}-x64-windows-release-${{ hashFiles('vcpkg.json') }}-9432c416
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-release-${{ hashFiles('vcpkg.json') }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: "9432c416e5c543eded0b4df35a4d347b2e669208"
          vcpkgJsonGlob: "vcpkg.json"

      - name: Report restored dependency cache
        shell: pwsh
        run: |
          $installed = Join-Path $env:VCPKG_INSTALLED_DIR "x64-windows"
          Write-Host "vcpkg installed tree exists: $(Test-Path $installed)"
          if (Test-Path $installed) { Get-ChildItem $installed | Select-Object -First 20 Name }

      # ── Overlay port: redirect libaec from blocked GitLab → GitHub mirror ─
      - name: Create libaec overlay port (GitHub mirror)
        shell: pwsh
        run: |
          $ver = $env:LIBAEC_VERSION

          # Download from GitHub — reliably accessible from Actions runners
          $githubUrl = "https://github.com/MathisRosenhauer/libaec/archive/refs/tags/v$ver.tar.gz"
          $tmpFile   = "$env:TEMP/libaec-github-v$ver.tar.gz"
          Write-Host "Downloading libaec v$ver from GitHub mirror..."
          Invoke-WebRequest -Uri $githubUrl -OutFile $tmpFile -UseBasicParsing -TimeoutSec 120

          # Compute SHA512 so the portfile hash matches exactly
          $sha512 = (Get-FileHash -Path $tmpFile -Algorithm SHA512).Hash.ToLower()
          Write-Host "SHA512: $sha512"

          # Place archive in vcpkg downloads directory (vcpkg will reuse it)
          $dlDir = "$env:VCPKG_ROOT/downloads"
          New-Item -ItemType Directory -Path $dlDir -Force | Out-Null
          Copy-Item $tmpFile "$dlDir/MathisRosenhauer-libaec-v$ver.tar.gz" -Force

          # Create overlay port directory
          $portDir = "${{ github.workspace }}/custom-ports/libaec"
          New-Item -ItemType Directory -Path $portDir -Force | Out-Null

          # portfile.cmake — uses vcpkg_from_github instead of vcpkg_from_gitlab
          @"
          vcpkg_from_github(
              OUT_SOURCE_PATH SOURCE_PATH
              REPO MathisRosenhauer/libaec
              REF "v$ver"
              SHA512 $sha512
              HEAD_REF master
          )

          vcpkg_cmake_configure(
              SOURCE_PATH "`${SOURCE_PATH}"
              OPTIONS
                  -DBUILD_TESTING=OFF
          )

          vcpkg_cmake_install()
          vcpkg_cmake_config_fixup(CONFIG_PATH lib/cmake/libaec)
          vcpkg_fixup_pkgconfig()

          file(REMOVE_RECURSE "`${CURRENT_PACKAGES_DIR}/debug/include")
          vcpkg_install_copyright(FILE_LIST "`${SOURCE_PATH}/LICENSE.txt")
          "@ | Out-File -Encoding utf8 "$portDir/portfile.cmake"

          # vcpkg.json for the port
          @"
          {
            "name": "libaec",
            "version": "$ver",
            "description": "Adaptive Entropy Coding library",
            "homepage": "https://github.com/MathisRosenhauer/libaec",
            "dependencies": [
              { "name": "vcpkg-cmake", "host": true },
              { "name": "vcpkg-cmake-config", "host": true }
            ]
          }
          "@ | Out-File -Encoding utf8 "$portDir/vcpkg.json"

          Write-Host "Overlay port created at: $portDir"

      # ── MSVC ──────────────────────────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # ── Configure ─────────────────────────────────────────────────────
      # The vcpkg cache holds the fully installed x64-windows tree. Running
      # the manifest install plan again costs hours (vcpkg rebuilds VTK/PCL
      # even when the tree is already there) and pushes the job towards its
      # timeout. Reuse the restored tree when it is complete; only fall back
      # to the install plan on a cold cache.
      - name: Configure CMake
        shell: pwsh
        run: |
          $vtkShare = Join-Path $env:VCPKG_INSTALLED_DIR "x64-windows/share/vtk"
          if (Test-Path $vtkShare) {
            $manifest = "-DVCPKG_MANIFEST_INSTALL=OFF"
          } else {
            $manifest = "-DVCPKG_MANIFEST_INSTALL=ON"
          }
          Write-Host "vcpkg installed tree: $(Test-Path $vtkShare) -> $manifest"
          cmake -B build -S . `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" `
            "-DVCPKG_INSTALL_OPTIONS=--clean-after-build" `
            "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/custom-triplets" `
            "-DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/custom-ports" `
            $manifest `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DFETCHCONTENT_SOURCE_DIR_ONNXRUNTIME=$env:ONNXRUNTIME_DIR" `
            "-DBUILD_TESTING=ON"

      - name: Dependency cache summary
        if: always()
        shell: pwsh
        run: |
          $installed = Join-Path $env:VCPKG_INSTALLED_DIR "x64-windows"
          if (Test-Path $installed) {
            $size = (Get-ChildItem -LiteralPath $installed -Recurse -File | Measure-Object Length -Sum).Sum / 1GB
            Write-Host "::notice::vcpkg installed tree: $([math]::Round($size, 2)) GB"
          } else {
            Write-Host "::warning::vcpkg installed tree was not created; CMake configuration failed before dependencies were restored."
          }

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      # ── Test ──────────────────────────────────────────────────────────
      - name: Run Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Disable Windows Error Reporting UI which hangs CI on crash/missing DLLs
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" -Name "DontShowUI" -Value 1 -ErrorAction SilentlyContinue
          
          # Add vcpkg bin directory to PATH so tests can find DLLs (OpenCV, PCL, etc.)
          $env:PATH = "$env:VCPKG_INSTALLED_DIR\x64-windows\bin;$env:PATH"
          
          ctest --test-dir build -C Release --output-on-failure --timeout 120

      # ── Coverage gate (guard layer) ───────────────────────────────────
      # Measured line-coverage floors for the kernel/guard/composition files
      # (tests/coverage_gate.py). The build ships Release PDBs (CMakeLists.txt
      # section 5b), which is what lets OpenCppCoverage map lines.
      - name: Install OpenCppCoverage
        shell: pwsh
        run: |
          # Chocolatey's NuGet v2 feed intermittently returns 503 for this
          # package and (incorrectly) exits successfully afterwards. Download
          # the pinned upstream installer instead, retry transient failures,
          # then verify the executable before the coverage gate starts.
          $version = "0.9.9.0"
          $installer = Join-Path $env:RUNNER_TEMP "OpenCppCoverageSetup-x64-$version.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "OpenCppCoverage"
          $url = "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-$version/OpenCppCoverageSetup-x64-$version.exe"

          curl.exe --fail --location --retry 3 --retry-all-errors --output $installer $url
          if ($LASTEXITCODE -ne 0) { Write-Error "OpenCppCoverage download failed with exit code $LASTEXITCODE"; exit 1 }

          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installDir"
          if ($LASTEXITCODE -ne 0) { Write-Error "OpenCppCoverage installer failed with exit code $LASTEXITCODE"; exit 1 }

          $tool = Join-Path $installDir "OpenCppCoverage.exe"
          if (-not (Test-Path -LiteralPath $tool)) { Write-Error "OpenCppCoverage.exe was not installed at $tool"; exit 1 }
          "OPENCPPCOVERAGE_EXE=$tool" >> $env:GITHUB_ENV

      - name: Coverage gate (guard layer)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:VCPKG_INSTALLED_DIR\x64-windows\bin;$env:PATH"
          python tests/coverage_gate.py

      # ── Mutation check (architecture guards) ──────────────────────────
      # Inverts one decision per guard, rebuilds only its owning target and
      # expects the owning test to fail. Runs after the suite because it edits
      # the very sources the suite reads; the script restores them byte-exact
      # and rebuilds the touched targets before exiting.
      - name: Mutation check (architecture guards)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          $env:PATH = "$env:VCPKG_INSTALLED_DIR\x64-windows\bin;$env:PATH"
          python tests/mutation_check.py
