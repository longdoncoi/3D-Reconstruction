name: Agent tool-call evals

on:
  push:
    branches: [main]
    paths: ["AIAssistant/**", "Config/agent_action_manifest.json"]
  pull_request:
    branches: [main]
    paths: ["AIAssistant/**", "Config/agent_action_manifest.json"]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "pydantic>=2.7"
      - run: python AIAssistant/evals/run_tool_eval.py
      - name: Agentic policy eval (routing / authorisation / verification)
        run: python AIAssistant/evals/run_agentic_eval.py > AIAssistant/evals/agentic_eval_report.json
      - run: python AIAssistant/tests/unit/test_action_manifest.py
      - name: Publish result summary
        run: |
          echo "## Agent tool-call evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat AIAssistant/evals/latest_tool_call_report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## Agentic policy evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;d=json.load(open('AIAssistant/evals/agentic_eval_report.json'));print(json.dumps({k:v for k,v in d.items() if k!='scenarios'},indent=2));print('scenarios:');print(json.dumps({k:{'passed':v['passed'],'failed':v['failed']} for k,v in d['scenarios'].items()},indent=2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-tool-call-trend
          path: AIAssistant/evals/latest_tool_call_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-policy-trend
          path: AIAssistant/evals/agentic_eval_report.json
