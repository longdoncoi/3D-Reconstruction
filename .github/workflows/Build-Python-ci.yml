# ──────────────────────────────────────────────────────────────────────────────
# Python CI — Lint & Validate AIAssistant
# Lightweight (~30s), only triggers on Python changes.
# ──────────────────────────────────────────────────────────────────────────────
name: Python CI

on:
  push:
    branches: [main]
    paths: ["AIAssistant/**"]
  pull_request:
    branches: [main]
    paths: ["AIAssistant/**"]
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  # Keep a running validation job: canceling a 30-second job buys little and
  # makes a failed commit harder to diagnose.
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AIAssistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        working-directory: AIAssistant
        run: ruff check . --output-format=github

      - name: Syntax check
        working-directory: AIAssistant
        run: python -m compileall -q StartChatbotServer.py modules evals src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AIAssistant/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AIAssistant/requirements-test.txt

      - name: Run test suite with coverage gate
        working-directory: AIAssistant
        # Floor is a regression guard, not a target: the measured baseline for
        # the offline suite is ~51% of the ai_assistant package.
        run: |
          python -m coverage run --source=ai_assistant -m unittest discover -s tests -p "test_*.py"
          python -m coverage report --fail-under=48

