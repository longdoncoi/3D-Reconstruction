# ──────────────────────────────────────────────────────────────────────────────
# Python CI — Lint & Validate AIAssistant
# Lightweight (~30s), only triggers on Python changes.
# ──────────────────────────────────────────────────────────────────────────────
name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "AIAssistant/**"
      - "AIComputerVision/**"
      - "src/app/AppConstants.h"
      # Read by tests/test_qt_contract.py (launch argv, labels, pct= regex).
      - "src/modules/AIProcessorPlugin/AITrainDockWidget.cpp"
  pull_request:
    branches: [main]
    paths:
      - "AIAssistant/**"
      - "AIComputerVision/**"
      - "src/app/AppConstants.h"
      - "src/modules/AIProcessorPlugin/AITrainDockWidget.cpp"
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  # Keep a running validation job: canceling a 30-second job buys little and
  # makes a failed commit harder to diagnose.
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AIAssistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          # PyYAML so AIComputerVision's preflight dataset tests can actually
          # parse data.yaml; the cvtrain job below also pins it.
          pip install "PyYAML==6.0.2"

      - name: Ruff lint
        working-directory: AIAssistant
        run: ruff check . --output-format=github

      - name: Syntax check
        working-directory: AIAssistant
        run: python -m compileall -q StartChatbotServer.py evals src

      - name: AIComputerVision — Ruff lint
        working-directory: AIComputerVision
        run: ruff check . --output-format=github

      - name: AIComputerVision — Unit tests
        working-directory: AIComputerVision
        run: python -m unittest discover -s tests -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AIAssistant/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AIAssistant/requirements-test.txt

      - name: Run test suite with coverage gate
        working-directory: AIAssistant
        # Floor is a regression guard, not a target: the measured baseline for
        # the offline suite is ~82% of the ai_assistant package (Oct 2026).
        run: |
          python -m coverage run --source=ai_assistant -m unittest discover -s tests -p "test_*.py"
          python -m coverage report --fail-under=65

      - name: Static analysis — import-linter architecture contracts
        working-directory: AIAssistant
        # Contracts live in pyproject.toml ([tool.importlinter]); expected to
        # include_external_packages and a src/ layout, so PYTHONPATH is set.
        run: PYTHONPATH=src lint-imports --no-logo

      - name: Static analysis — mypy full package
        working-directory: AIAssistant
        # Type-checks the whole ai_assistant package (domain, ports, application,
        # agents, orchestration, adapters, tools, rag, llm, bootstrap, legacy).
        # Third-party packages without stubs are imported as Any.
        run: mypy src/ai_assistant

  cvtrain:
    # Offline lint + type check + unit tests for the AIComputerVision training
    # pipeline. No ML dependencies are installed: ultralytics is imported
    # lazily (only through cvtrain.backend), and the suite only needs PyYAML to
    # validate dataset YAML files. Coverage is gated at 100% (statements and
    # branches) because cvtrain holds two contracts with the Qt application.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint/test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy coverage PyYAML==6.0.2

      - name: Ruff lint
        run: ruff check AIComputerVision --output-format=github

      - name: Type check
        working-directory: AIComputerVision
        run: python -m mypy

      - name: Syntax check
        run: python -m compileall -q AIComputerVision/cvtrain AIComputerVision/TrainModel.py AIComputerVision/tests

      - name: "Unit tests (coverage gate: 100%)"
        working-directory: AIComputerVision
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

