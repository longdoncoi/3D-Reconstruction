# ──────────────────────────────────────────────────────────────────────────────
# Python CI — Lint & Validate AIAssistant
#
# ADR 0032: every action is pinned to a commit SHA and every tool the gates
# depend on comes from the hash-pinned lock, so a build is reproducible and a
# retagged upstream release cannot execute with this repository's token.
#
# The gates run on ubuntu *and* on windows: the product ships on Windows, and
# two of the security guards (the sandbox's path-shaped executable and the
# absolute-path escape) only execute on Windows — a linux-only CI would report
# green while the platform the users run was never checked.
# ──────────────────────────────────────────────────────────────────────────────
name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "AIAssistant/**"
      # The at-rest envelope is a contract between the C++ client and the
      # Python service. A change on either side must re-run the contract test
      # that pins the other side's vector (ADR 0032).
      - "src/core/AtRestCipher.cpp"
      - "src/core/AtRestCipher.h"
      - "tests/TestAtRestCipher.cpp"
  pull_request:
    branches: [main]
    paths:
      - "AIAssistant/**"
      - "src/core/AtRestCipher.cpp"
      - "src/core/AtRestCipher.h"
      - "tests/TestAtRestCipher.cpp"
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  # Keep a running validation job: canceling a 30-second job buys little and
  # makes a failed commit harder to diagnose.
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AIAssistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The linter comes from the hash-pinned lock, not from a floating
          # ``pip install ruff``: an unpinned release could change the lint
          # semantics of a build without anyone reviewing the change.
          pip install --require-hashes -r AIAssistant/requirements-test.lock

      - name: Ruff lint
        working-directory: AIAssistant
        run: ruff check . --output-format=github

      - name: Syntax check
        working-directory: AIAssistant
        run: python -m compileall -q evals src

  test:
    runs-on: ubuntu-latest
    # Finite budget containing the worst case: the full suite + coverage +
    # mypy + 74 mutants, where the recompose-guard mutant alone may burn its
    # 180s timeout pin (ADR 0022) instead of failing fast.
    timeout-minutes: 25
    # A clean test exit also means releasing every file, pipe and socket.
    # Resource warnings are failures, never ignorable output noise.
    env:
      PYTHONWARNINGS: error::ResourceWarning

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AIAssistant/requirements-test.lock

      - name: Install test dependencies (hash-verified lock)
        # requirements-test.lock pins every distribution version *and*
        # SHA-256; --require-hashes makes pip refuse any artifact whose digest
        # does not match, so a republished or tampered wheel cannot enter the
        # coverage run (ADR 0023). Regenerate with:
        #   uv pip compile requirements-test.txt --python-version 3.11 \
        #       --universal --generate-hashes -o requirements-test.lock
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r AIAssistant/requirements-test.lock

      - name: Run test suite with coverage gate
        working-directory: AIAssistant
        # ``pyproject.toml`` is the single source of truth: ``branch = true``,
        # ``source = ["ai_assistant"]`` and ``fail_under = 100`` live there, so
        # local runs and this job measure exactly the same thing. The floor is
        # a regression guard, not a target: the measured baseline is 100% of
        # statements *and* branches (Oct 2026, ADR 0016), so any single
        # uncovered line or partial branch turns the job red.
        run: |
          python scripts/run_test_suite.py
          python -m coverage report

      - name: Static analysis — import-linter architecture contracts
        working-directory: AIAssistant
        # Contracts live in pyproject.toml ([tool.importlinter]); expected to
        # include_external_packages and a src/ layout, so PYTHONPATH is set.
        run: PYTHONPATH=src lint-imports --no-logo

      - name: Static analysis — mypy full package
        working-directory: AIAssistant
        # Type-checks the whole ai_assistant package (domain, ports, application,
        # agents, orchestration, adapters, tools, rag, llm, bootstrap).
        # Third-party packages without stubs are imported as Any.
        run: mypy src/ai_assistant

      - name: Mutation check — load-bearing guards (ADR 0015)
        working-directory: AIAssistant
        # Inverts one decision at a time in the sandbox allow-list, the HITL
        # approval gate, the transport policy, the cache seal and the cancel
        # races, and requires the owning tests to fail. It rewrites those
        # source files in place and restores them in a ``finally`` guarded by a
        # lock file, so it runs last in this job — never alongside a step that
        # reads src/ (the suite above already finished).
        # Preserve all killed/survived/stale verdicts so a failed sweep is
        # diagnosable without rerunning source-mutating checks locally.
        # ``pipefail`` keeps ``tee`` from masking a failed mutation gate.
        run: |
          set -o pipefail
          PYTHONPATH=src python -W error::ResourceWarning scripts/mutation_check.py 2>&1 | tee mutation_check.log

      - name: Upload mutation transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aiassistant-mutation-transcript-linux
          path: AIAssistant/mutation_check.log
          if-no-files-found: error

  windows:
    # ADR 0032: the product ships on Windows, and two of the sandbox's
    # security guards only execute there — the "a path-shaped executable is
    # refused" check and the "an absolute path cannot escape the project" one.
    # Both are ``skipUnless(win32)``, so a linux-only CI reported green while
    # the platform the users run was never checked.
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONWARNINGS: error::ResourceWarning

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AIAssistant/requirements-test.lock

      - name: Install test dependencies (hash-verified lock)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r AIAssistant/requirements-test.lock

      - name: Windows-only security guards
        working-directory: AIAssistant
        # The two guards that only run on Windows, plus the whole sandbox
        # suite they live in.
        run: python -m unittest tests.unit.test_sandbox tests.unit.test_path_utils -v

      - name: Run test suite with coverage gate
        working-directory: AIAssistant
        run: |
          python scripts/run_test_suite.py
          python -m coverage report

      - name: Static analysis — import-linter architecture contracts
        working-directory: AIAssistant
        # ``PYTHONPATH=src lint-imports`` is a bash assignment: on a
        # windows-latest runner the default shell is PowerShell, which reads
        # it as a command name and fails the step. The environment is set
        # through the step's ``env`` block instead, so the same command works
        # on both runners.
        env:
          PYTHONPATH: src
        run: lint-imports --no-logo

      - name: Static analysis — mypy full package
        working-directory: AIAssistant
        run: mypy src/ai_assistant
